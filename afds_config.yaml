# AFDS Validator Configuration for openwrt-mcp
#
# CAFDS HTTP validator is not in CI (`use_docs_validation: false`).
# Keep this map in sync with docs/meta/doc-registry.md.
#
# AFDS-shaped spec: docs/openwrt-mcp.md
# Exempt: operator prose without AFDS frontmatter, plus meta/template.

exempt_files:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - docs/ARCHITECTURE.md
  - docs/SECURITY.md
  - docs/meta/doc-registry.md
  - docs/meta/glossary.md
  - docs/templates/doc-template.md

default_paths:
  - docs/

excluded_dirs:
  - archived
  - archive
  - docs/meta
  - docs/templates
